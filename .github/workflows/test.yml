name: Test

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['22', '24']

    steps:
      - uses: gh-top-languages/.github/.github/actions/setup@a790af830c76173b419fdd09dc8c949709604e1f
        with:
          node-version: ${{ matrix.node-version }}

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test:coverage
